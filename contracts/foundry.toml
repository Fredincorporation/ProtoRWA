[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Windows: Foundry mixes \ and / when creating artifact folders, which fails on
# some filesystems. `cache_path`/`out` are kept relative and pre-created by the
# build script so artifact directories always have a parent.
cache_path = "cache"
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

# Robinhood Chain first, Arbitrum Sepolia as the fallback target.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

[fuzz]
runs = 256
max_test_rejects = 65536

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
number_underscore = "thousands"

[invariant]
runs = 64
depth = 32
fail_on_revert = false
